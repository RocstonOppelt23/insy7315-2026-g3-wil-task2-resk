name: .NET 8 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "RESK.WIL.slnx"

      - name: Build
        run: dotnet build "RESK.WIL.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "RESK.WIL.slnx" --configuration Release --no-build --verbosity normal --logger "GitHubActions;summary-include-passed=false"

      - name: Publish (artifact)
        run: |
          dotnet publish "RESK.WIL.csproj" -c Release -o ${{ runner.temp }}/publish

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ${{ runner.temp }}/publish

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      # Fails the pipeline if the live site doesn't come back healthy.
      # /health returns 200 only when the app is running AND can reach
      # the database. Retries for ~3 minutes while the app restarts.
      - name: Post-deploy health check
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL || steps.deploy.outputs.webapp-url }}
        run: |
          url="${APP_URL%/}/health"
          echo "Checking $url"
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error --max-time 30 --output health.json --write-out '%{http_code}' "$url" || echo "000")
            echo "Attempt $attempt: HTTP $code"
            if [ -f health.json ]; then cat health.json; echo; fi
            if [ "$code" = "200" ]; then
              echo "Deployment is healthy."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Health check failed at $url after deployment"
          exit 1